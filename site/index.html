<p><strong>Anubhav Gain</strong></p>
<p>Security software engineer at Infopercept. I build endpoint control, XDR pipelines and Rust agents: software whose job is to say no.</p>
<p>This page is an interactive editor and needs JavaScript. The same content is on the <a href="/#readme">README</a>.</p>
<p>Work</p>
<ul>
<li>07/2024 – present: Security Software Engineer, Infopercept. Deployment architecture for Invinsense XDR / OXDR, single and multi-tenant. Custom OpenSearch Dashboards plugins, Rust monitoring agents, Wazuh and Fluent Bit alert pipelines.</li>
<li>05/2026 – present: Endpoint Security Consultant, Mahindra Finance. Invinsense 7.0 Unified Endpoint Control: application allow-listing, policy review to deployment workflows and endpoint telemetry across Windows, macOS and Linux.</li>
<li>03/2026 – 05/2026: Application Security Consultant, SBI Life. Application security assessments and VAPT, with design reviews against financial-sector and data-protection standards.</li>
<li>11/2023 – 07/2024: DevSecOps Engineer, Atcults. Security testing pipelines, infrastructure as code with Terraform, container and Kubernetes hardening.</li>
<li>11/2022 – 10/2023: IT Security Specialist, Parul University. Palo Alto firewalls, Red Hat and Windows servers, AWS and endpoint configuration management.</li>
<li>2020 – present: Founder, Gain Fisheries. A fish hatchery in Pakhanjur, Chhattisgarh.</li>
</ul>
<p>Projects</p>
<ul>
<li><a href="https://github.com/anubhavg-icpl/leviathan">Leviathan</a>: A Windows kernel-mode EDR/XDR framework written in Rust on windows-drivers-rs.</li>
<li><a href="https://github.com/anubhavg-icpl/atomic-prevention">Atomic Prevention</a>: A prevention-focused living-off-the-land testing framework mapped to MITRE ATT&amp;CK.</li>
<li><a href="https://github.com/anubhavg-icpl/agni">Agni</a>: A CLI and web UI for running Firecracker microVMs, an alternative to firectl.</li>
<li><a href="https://github.com/anubhavg-icpl/krustron">Krustron</a>: An open-source Devtron alternative: one dashboard for clusters, GitOps CI/CD and observability.</li>
<li><a href="https://github.com/mranv/ebpf-file-monitor">eBPF File Monitor</a>: File monitoring for Linux in Rust, with inotify and eBPF and timestamped audit logs.</li>
<li><a href="https://github.com/anubhavg-icpl/convoy">Convoy</a>: Your own autonomous system on one VPS, as a Docker Compose stack.</li>
<li><a href="https://github.com/anubhavg-icpl/vibe">vibe</a>: A library of AI chat modes for software engineering, architecture and security analysis.</li>
<li><a href="https://github.com/mranv/adPentest">adPentest</a>: Documentation for Windows Active Directory penetration testing.</li>
<li><a href="https://github.com/Infopercept/opensearch-rust-sdk">opensearch-rust-sdk</a>: An OpenSearch Extensions SDK for Rust, built at Infopercept.</li>
<li><a href="https://github.com/mranv/osdls">osdls</a>: Wazuh, Logstash, OpenSearch and OpenSearch Dashboards as one stack.</li>
<li><a href="https://github.com/anubhavg-icpl/appControlBusiness">appControlBusiness</a>: Working notes on App Control for Business (WDAC).</li>
<li><a href="https://github.com/mranv/tls.rs">tls.rs</a>: A TCP client and server in Rust with TLS and real-time data transmission.</li>
<li><a href="https://github.com/mranv/linux.micrognu">linux.micrognu</a>: A small GUI Linux distribution for QEMU, built from the kernel, BusyBox and Nano-X.</li>
</ul>
